# PlayerRotation configuration
# Place this file at Data\SKSE\Plugins\PlayerRotation.toml

# Mouse/keyboard button held to rotate the character in RaceMenu.
# Uses SKSE input codes: keyboard keys are DirectX scancodes (0-255),
# mouse buttons start at 256 (256 = left click, 257 = right click, 258 = middle click).
# Gamepad rotation always uses the right thumbstick and ignores this setting.
KeyCode = 257

# Rotation speed range. Slow input rotates at the minimum speed,
# fast mouse movement or full thumbstick deflection rotates at the maximum.
MinimumRotationSpeed = 3.0
MaximumRotationSpeed = 12.0
